name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "s/__APP_VERSION__/$VERSION/g" web/index.html
          grep -q "'$VERSION'" web/index.html && echo "App version: $VERSION"

      - name: Prepare preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null || echo "::warning::sdkmanager install skipped"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/leadmaster-release.jks
            echo "Using release signing key"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - APK signed with a temporary debug key"
          fi

      - name: Build signed APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Package APK and EdgeOne ZIP
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "LeadMaster-v$VERSION.apk"
          (cd web && zip -q "../LeadMaster-EdgeOne-v$VERSION.zip" index.html)
          ls -la LeadMaster-*

      - name: Upload files (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: LeadMaster-v${{ env.VERSION }}
          path: |
            LeadMaster-v${{ env.VERSION }}.apk
            LeadMaster-EdgeOne-v${{ env.VERSION }}.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: LeadMaster v${{ env.VERSION }}
          body: |
            **Version ${{ env.VERSION }}**

            - `LeadMaster-v${{ env.VERSION }}.apk` → install on Android phones (updates the old app)
            - `LeadMaster-EdgeOne-v${{ env.VERSION }}.zip` → upload to EdgeOne Pages (New Deployment)

            Change: ${{ github.event.head_commit.message }}
          files: |
            LeadMaster-v${{ env.VERSION }}.apk
            LeadMaster-EdgeOne-v${{ env.VERSION }}.zip
